<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Product preview card component</title>
    <meta name="description" content="A single product preview card component that shows product information.">

    <link rel="preload" href="assets/fonts/montserrat-v31-latin-500.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="assets/fonts/montserrat-v31-latin-700.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="assets/fonts/fraunces-v38-latin-700.woff2" as="font" type="font/woff2" crossorigin="anonymous">

    <link rel="stylesheet" href="styles/style.css">

  </head>
  <body>
    <main>
      <article class="product">
        <picture>
          <source srcset="./assets/images/image-product-desktop.jpg" media="(min-width: 48em)">
          <img class="product__img" src="assets/images/image-product-cropped.jpg" alt="Gabrielle Essence Eau De Parfum bottle" width="686" height="480">
        </picture>
        <section class="product__details">
          <div class="product__overview">
            <span class="product__category">perfume</span>
            <h1 class="product__title">Gabrielle Essence Eau De Parfum</h1>
            <p class="product__description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
          </div>
          <p class="product__price">
            <span class="product__current-price">$149.99</span>
            <del class="product__old-price">$169.99</del>
          </p>
          <button type="button" class="product__action">
            <img src="assets/images/icon-cart.svg" alt="" width="16" height="16" aria-label="Add Gabrielle Essence Eau De Parfum to cart">
            Add to Cart
          </button>
        </section>
      </article>

    </main>
  </body>
</html>
