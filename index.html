<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Product preview card component</title>

    <link rel="preload" href="assets/fonts/montserrat-v31-latin-500.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="assets/fonts/montserrat-v31-latin-700.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="assets/fonts/fraunces-v38-latin-700.woff2" as="font" type="font/woff2" crossorigin="anonymous">

    <link rel="stylesheet" href="styles/style.css">

  </head>
  <body>
    <main>
      <h1 class="sr-only">Sample Product Preview Card</h1>
      <article class="product" aria-labelledby="product-title">
        <picture>
          <source srcset="./assets/images/image-product-desktop.jpg" media="(min-width: 48em)" width="600" height="900">
          <img class="product__img" src="assets/images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum bottle" width="686" height="480">
        </picture>
        <div class="product__details">
          <span class="product__category">perfume</span>
          <h2 id="product-title" class="product__title">Gabrielle Essence Eau De Parfum</h2>
          <p class="product__description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
        </div>
        <p class="product__price">
          <span class="product__current-price">$149.99</span>
          <s class="product__old-price">$169.99</s>
        </p>
        <button type="button" class="product__action">
          <img src="assets/images/icon-cart.svg" alt="" width="16" height="16">
          Add to Cart
        </button>
      </article>

    </main>
  </body>
</html>
